[project]
name = "pao-rotation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "configparser>=7.2.0",
    "dimx==1.1.3",
    "gmn==1.5.1",
    "matplotlib>=3.11.0",
    "network>=0.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=7.0.0",
    "pyedm==2.5.0",
    "statsmodels>=0.14.0",
    "torch>=2.13.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
